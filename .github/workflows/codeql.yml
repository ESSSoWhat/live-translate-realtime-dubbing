# CodeQL advanced setup for security scanning.
#
# Java/Kotlin uses manual build mode because this monorepo has multiple
# Gradle trees (android/, mobile/android/, whisper.cpp examples), so
# CodeQL autobuild cannot pick a single project.

name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 20 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: c-cpp
          build-mode: none
        - language: java-kotlin
          build-mode: manual
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none
        # Swift omitted: no standalone iOS/macOS target; Flutter iOS is not
        # built in this workflow and CodeQL Swift autobuild fails.

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Java 17
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Flutter
      if: matrix.language == 'java-kotlin'
      uses: subosito/flutter-action@v2
      with:
        flutter-version: "3.27.x"
        channel: stable

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Build Java/Kotlin (Flutter Android)
      if: matrix.build-mode == 'manual' && matrix.language == 'java-kotlin'
      shell: bash
      run: |
        cd mobile
        flutter pub get
        flutter build apk --debug

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
